name: Build and Push to Dockerfile

on:
  push:
    tags:
      - v*

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_REPO }}:${{ github.ref_name }}

  helm_values:
    name: Bump Helm values (GitOps - direct push)
    runs-on: ubuntu-24.04
    needs: [ build ]

    permissions:
      contents: read

    steps:
      - name: Checkout Helm repo (github.com)
        uses: actions/checkout@v4
        with:
          repository: yazidalg/motion-chart
          github-server-url: https://github.com
          token: ${{ secrets.HELM_REPO_TOKEN }}
          ref: main
          path: motion-chart

      - name: Install yq (no sudo)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          wget -qO "$HOME/.local/bin/yq" https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          chmod +x "$HOME/.local/bin/yq"
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Update lidm-api image tag in values.yaml
        shell: bash
        run: |
          set -euo pipefail
          FILE="motion-chart/lidm-api/values.yaml"
          TAG="${{ github.ref_name }}"
          yq -i ".image.tag = \"${TAG}\"" "$FILE"

      - name: Commit and push to Helm repo
        shell: bash
        run: |
          set -euo pipefail
          cd motion-chart

          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"

          git add lidm-api/values.yaml

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore(lidm-api): bump image tag to ${{ github.ref_name }}"
          git push